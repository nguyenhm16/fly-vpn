name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check flyexit/ main.py

      - name: Ruff format check
        run: uv run ruff format --check flyexit/ main.py

      - name: Build package
        run: uv build

      - name: Smoke-test installed wheel outside the source checkout
        run: |
          python -m venv /tmp/fly-vpn-smoke
          /tmp/fly-vpn-smoke/bin/pip install dist/*.whl
          /tmp/fly-vpn-smoke/bin/fly-vpn --stats
